# Local synthetic environment only. No hosted project is linked.
project_id = "orbe-finance"
[api]
enabled = true
port = 54341
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 200
auto_expose_new_tables = false
[api.tls]
enabled = false
[db]
port = 54342
shadow_port = 54340
major_version = 17
health_timeout = "2m"
[db.pooler]
enabled = false
port = 54349
[db.migrations]
enabled = true
schema_paths = []
[db.seed]
enabled = false
sql_paths = []
[realtime]
enabled = false
[studio]
enabled = false
port = 54343
[local_smtp]
enabled = true
port = 54344
[storage]
enabled = false
[storage.s3_protocol]
enabled = false
[storage.analytics]
enabled = false
[storage.vector]
enabled = false
[auth]
enabled = true
site_url = "http://127.0.0.1:8083"
additional_redirect_urls = []
jwt_expiry = 600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = false
enable_anonymous_sign_ins = false
enable_manual_linking = false
minimum_password_length = 12
password_requirements = ""
[auth.rate_limit]
email_sent = 5
token_refresh = 30
sign_in_sign_ups = 10
token_verifications = 10
[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "60s"
otp_length = 6
otp_expiry = 600
[auth.sms]
enable_signup = false
[edge_runtime]
enabled = false
[analytics]
enabled = false
